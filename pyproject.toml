[project]
name = "cv-generator"
version = "0.1.0"
description = "CV Generator for Software Engineers"
readme = "README.md"
authors = [
    { name = "Paulo Benatto", email = "paulobenatto02@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1,<4",
    "pyyaml>=6,<7",
    "weasyprint>=62,<70",
]

[project.scripts]
generate = "generate:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["generate"]